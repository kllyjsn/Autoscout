[project]
name = "autoscout-api"
version = "0.1.0"
description = "Car market aggregator API — scrapes listings from CarGurus, Cars.com, AutoTrader, Carvana, CarMax and more"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "lxml>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
